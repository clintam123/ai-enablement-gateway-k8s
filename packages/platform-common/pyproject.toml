[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "platform-common"
version = "0.1.0"
description = "Canonical domain schemas, Policy Bundle loader, and shared contracts"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.10.4",
    "pyjwt[crypto]>=2.10.1",
    "pyyaml>=6.0.2",
]

[tool.hatch.build.targets.wheel]
packages = ["src/platform_common"]

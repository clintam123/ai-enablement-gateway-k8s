[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mcp-runtime"
version = "0.1.0"
description = "Guarded stateless Streamable HTTP MCP Runtime service"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.6",
    "mcp>=1.26.0,<2.0.0",
    "opentelemetry-api>=1.29.0",
    "opentelemetry-exporter-otlp-proto-http>=1.29.0",
    "opentelemetry-sdk>=1.29.0",
    "platform-common",
    "pydantic>=2.10.4",
    "pydantic-settings>=2.7.1",
    "redis>=5.0.0",
    "uvicorn>=0.34.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/mcp_runtime"]

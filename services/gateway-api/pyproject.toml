[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "gateway-api"
version = "0.1.0"
description = "Control Plane front door for governed LLM and MCP traffic"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.6",
    "httpx>=0.28.1",
    "platform-common",
    "pydantic>=2.10.4",
    "pydantic-settings>=2.7.1",
    "uvicorn>=0.34.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/gateway_api"]

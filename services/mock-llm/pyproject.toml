[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mock-llm"
version = "0.1.0"
description = "Deterministic OpenAI-compatible Mock Provider with fault injection"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.6",
    "platform-common",
    "pydantic>=2.10.4",
    "pydantic-settings>=2.7.1",
    "uvicorn>=0.34.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/mock_llm"]

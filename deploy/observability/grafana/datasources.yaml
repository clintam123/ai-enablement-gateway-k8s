apiVersion: 1

datasources:
  - name: Prometheus
    type: prometheus
    uid: prometheus
    access: proxy
    url: http://prometheus.observability.svc.cluster.local:9090
    isDefault: true
    editable: false
    jsonData:
      httpMethod: POST
      timeInterval: 15s
      exemplarTraceIdDestinations:
        - datasourceUid: jaeger
          name: traceID

  - name: Jaeger
    type: jaeger
    uid: jaeger
    access: proxy
    url: http://jaeger.observability.svc.cluster.local:16686
    isDefault: false
    editable: false

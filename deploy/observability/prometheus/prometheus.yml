global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/rules/*.yml

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets:
          - localhost:9090

  - job_name: ai-gateway-control-plane
    metrics_path: /metrics
    scheme: http
    dns_sd_configs:
      - names:
          - ai-gateway-gateway-api-headless.ai-gateway.svc.cluster.local
        type: A
        port: 8000
        refresh_interval: 15s

apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "ai-enablement-platform.policyBundleConfigMapName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "ai-enablement-platform.labels" . | nindent 4 }}
    app.kubernetes.io/component: gateway-api
immutable: {{ .Values.configMaps.immutable }}
data:
  policy-bundle.yaml: |
{{ include "ai-enablement-platform.policyBundleContent" . | trimSuffix "\n" | indent 4 }}

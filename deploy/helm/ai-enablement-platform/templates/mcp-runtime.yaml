{{- $component := "mcp-runtime" -}}
{{- $name := include "ai-enablement-platform.componentName" (dict "root" . "component" $component) -}}
{{- $redisService := include "ai-enablement-platform.componentName" (dict "root" . "component" "redis") -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "ai-enablement-platform.labels" . | nindent 4 }}
    app.kubernetes.io/component: {{ $component }}
  annotations:
    checkov.io/skip1: "CKV_K8S_35=MCP Runtime reads internal identity signing secret via Secret env var"
    checkov.io/skip2: "CKV_K8S_43=Image tag is parameterized for local Kind builds and immutable release tags"
    checkov.io/skip3: "CKV_K8S_15=Default IfNotPresent pullPolicy supports offline Kind preloaded images while cloud deployments override to Always"
spec:
  replicas: {{ .Values.mcpRuntime.replicaCount }}
  selector:
    matchLabels:
      {{- include "ai-enablement-platform.componentSelectorLabels" (dict "Chart" .Chart "Release" .Release "Values" .Values "component" $component) | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "ai-enablement-platform.labels" . | nindent 8 }}
        app.kubernetes.io/component: {{ $component }}
      annotations:
        checksum/policy-bundle: {{ include (print $.Template.BasePath "/configmap-policy-bundle.yaml") . | sha256sum }}
    spec:
      serviceAccountName: {{ $name }}
      automountServiceAccountToken: false
      securityContext:
        {{- include "ai-enablement-platform.hardenedPodSecurityContext" (dict "uid" 10001) | nindent 8 }}
      containers:
        - name: mcp-runtime
          image: "{{ .Values.mcpRuntime.image.repository }}:{{ .Values.mcpRuntime.image.tag }}"
          imagePullPolicy: {{ .Values.mcpRuntime.image.pullPolicy }}
          securityContext:
            {{- include "ai-enablement-platform.hardenedContainerSecurityContext" (dict "uid" 10001) | nindent 12 }}
          ports:
            - name: http
              containerPort: 8002
              protocol: TCP
          env:
            - name: HOME
              value: "/tmp"
            - name: MCP_RUNTIME_POLICY_BUNDLE_PATH
              value: "/etc/mcp/policy-bundle.yaml"
            - name: MCP_RUNTIME_REDIS_URL
              value: {{ printf "redis://%s:%d/0" $redisService (int .Values.redis.service.port) | quote }}
            - name: MCP_RUNTIME_REQUIRE_REDIS
              value: "true"
            - name: MCP_RUNTIME_TOOL_TIMEOUT_SECONDS
              value: {{ .Values.mcpRuntime.toolTimeoutSeconds | quote }}
            - name: MCP_RUNTIME_MAX_TOOL_CALLS_PER_RUN
              value: {{ .Values.mcpRuntime.maxToolCallsPerRun | quote }}
            - name: MCP_RUNTIME_RUN_TTL_SECONDS
              value: {{ .Values.mcpRuntime.runTtlSeconds | quote }}
            - name: MCP_RUNTIME_INTERNAL_IDENTITY_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.mcpRuntime.existingSecret }}
                  key: {{ .Values.secrets.mcpRuntime.internalIdentitySecretKey }}
            {{- if .Values.observability.otlpEndpoint }}
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: {{ .Values.observability.otlpEndpoint | quote }}
            {{- end }}
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            {{- toYaml .Values.mcpRuntime.resources | nindent 12 }}
          volumeMounts:
            - name: policy-bundle
              mountPath: /etc/mcp/policy-bundle.yaml
              subPath: policy-bundle.yaml
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: policy-bundle
          configMap:
            name: {{ include "ai-enablement-platform.policyBundleConfigMapName" . }}
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "ai-enablement-platform.labels" . | nindent 4 }}
    app.kubernetes.io/component: {{ $component }}
spec:
  type: ClusterIP
  selector:
    {{- include "ai-enablement-platform.componentSelectorLabels" (dict "Chart" .Chart "Release" .Release "Values" .Values "component" $component) | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.mcpRuntime.service.port }}
      targetPort: http
      protocol: TCP

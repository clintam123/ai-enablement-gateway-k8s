apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "ai-enablement-platform.litellmConfigMapName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "ai-enablement-platform.labels" . | nindent 4 }}
    app.kubernetes.io/component: litellm-proxy
immutable: {{ .Values.configMaps.immutable }}
data:
  config.yaml: |
{{ include "ai-enablement-platform.litellmConfigContent" . | trimSuffix "\n" | indent 4 }}

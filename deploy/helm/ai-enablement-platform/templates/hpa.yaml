{{- if .Values.gatewayApi.autoscaling.enabled }}
{{- $name := include "ai-enablement-platform.componentName" (dict "root" . "component" "gateway-api") -}}
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ $name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "ai-enablement-platform.labels" . | nindent 4 }}
    app.kubernetes.io/component: gateway-api
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ $name }}
  minReplicas: {{ .Values.gatewayApi.autoscaling.minReplicas }}
  maxReplicas: {{ .Values.gatewayApi.autoscaling.maxReplicas }}
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: {{ .Values.gatewayApi.autoscaling.targetCPUUtilizationPercentage }}
  behavior:
    scaleUp:
      stabilizationWindowSeconds: {{ .Values.gatewayApi.autoscaling.scaleUpStabilizationWindowSeconds }}
      policies:
        - type: Pods
          value: 2
          periodSeconds: 15
    scaleDown:
      stabilizationWindowSeconds: {{ .Values.gatewayApi.autoscaling.scaleDownStabilizationWindowSeconds }}
      policies:
        - type: Pods
          value: 1
          periodSeconds: 60
{{- end }}

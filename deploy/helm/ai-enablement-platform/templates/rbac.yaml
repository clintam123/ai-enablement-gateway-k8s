{{- $root := . -}}
{{- $components := list "gateway-api" "litellm-proxy" "mock-llm-primary" "mock-llm-fallback" "redis" -}}
{{- range $index, $component := $components -}}
{{- if $index }}
---
{{- end }}
{{- $name := include "ai-enablement-platform.componentName" (dict "root" $root "component" $component) }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $name }}
  namespace: {{ $root.Release.Namespace }}
  labels:
    {{- include "ai-enablement-platform.labels" $root | nindent 4 }}
    app.kubernetes.io/component: {{ $component }}
automountServiceAccountToken: false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ $name }}
  namespace: {{ $root.Release.Namespace }}
  labels:
    {{- include "ai-enablement-platform.labels" $root | nindent 4 }}
    app.kubernetes.io/component: {{ $component }}
rules: []
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ $name }}
  namespace: {{ $root.Release.Namespace }}
  labels:
    {{- include "ai-enablement-platform.labels" $root | nindent 4 }}
    app.kubernetes.io/component: {{ $component }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ $name }}
subjects:
  - kind: ServiceAccount
    name: {{ $name }}
    namespace: {{ $root.Release.Namespace }}
{{- end }}
